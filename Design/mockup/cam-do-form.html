<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thêm hồ sơ cầm đồ — TP83</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<link rel="stylesheet" href="assets/common.css">
</head>
<body data-page="pawn">
<div id="app-shell">

  <nav class="text-sm text-slate-500" aria-label="Breadcrumb"><a href="cam-do.html" class="hover:underline">Cầm đồ & Tín chấp</a> / Thêm hồ sơ</nav>
  <h1 class="mt-1 text-2xl font-bold">Thêm hồ sơ</h1>

  <form class="mt-6 grid grid-cols-1 xl:grid-cols-[1fr_340px] gap-6 items-start" action="cam-do-chi-tiet.html">
    <div class="flex flex-col gap-6">

      <section class="card p-5" aria-labelledby="s-customer">
        <div class="flex flex-wrap items-center gap-3">
          <h2 id="s-customer" class="font-semibold">Thông tin khách hàng</h2>
          <div class="ml-auto flex gap-4 text-sm">
            <label class="flex items-center gap-2"><input type="radio" name="ctype" checked> Khách mới</label>
            <label class="flex items-center gap-2"><input type="radio" name="ctype"> Khách cũ</label>
          </div>
        </div>
        <div class="mt-4 grid sm:grid-cols-2 gap-4">
          <div class="field"><label for="c-name">Tên khách hàng <span class="req">*</span></label><input id="c-name" class="input" placeholder="Họ và tên"></div>
          <div class="field"><label for="c-code">Mã hợp đồng <span class="req">*</span></label><input id="c-code" class="input" value="CD-0442"></div>
          <div class="field"><label for="c-cccd">Số CCCD</label><input id="c-cccd" class="input" inputmode="numeric" maxlength="12"></div>
          <div class="field"><label for="c-phone">Số điện thoại</label><input id="c-phone" class="input" inputmode="tel"></div>
          <div class="field sm:col-span-2"><label for="c-addr">Địa chỉ</label><input id="c-addr" class="input"></div>
        </div>
      </section>

      <section class="card p-5" aria-labelledby="s-loan">
        <h2 id="s-loan" class="font-semibold">Thông tin khoản vay</h2>
        <div class="mt-4 grid sm:grid-cols-2 gap-4">
          <fieldset class="field sm:col-span-2">
            <legend class="text-[13px] font-medium text-slate-700 mb-1.5">Loại tài sản <span class="req">*</span></legend>
            <div class="flex gap-3">
              <label class="flex-1 card !rounded-lg p-3 flex items-center gap-2 text-sm cursor-pointer has-[:checked]:border-teal-700 has-[:checked]:bg-teal-50"><input type="radio" name="kind" value="secured" checked> Thế chấp (cầm đồ)</label>
              <label class="flex-1 card !rounded-lg p-3 flex items-center gap-2 text-sm cursor-pointer has-[:checked]:border-teal-700 has-[:checked]:bg-teal-50"><input type="radio" name="kind" value="unsecured"> Tín chấp</label>
            </div>
          </fieldset>
          <div class="field sm:col-span-2" id="asset-wrap"><label for="l-asset">Tên tài sản <span class="req">*</span></label><input id="l-asset" class="input" placeholder="VD: Honda Vision 2022, biển 59X1-xxx.xx"></div>
          <div class="field"><label for="l-amount">Số tiền vay <span class="req">*</span></label><input id="l-amount" class="input num" inputmode="numeric" value="15.000.000"></div>
          <div class="field"><label for="l-date">Ngày vay <span class="req">*</span></label><input id="l-date" type="date" class="input" value="2026-10-19"></div>
          <div class="field"><label for="l-type">Hình thức lãi <span class="req">*</span></label>
            <select id="l-type" class="input">
              <option value="kpm">Lãi ngày (k / triệu / ngày)</option>
              <option value="month">Lãi tháng (% / tháng)</option>
              <option value="week">Lãi tuần (% / tuần)</option>
            </select>
          </div>
          <div class="field"><label for="l-rate">Lãi <span class="req">*</span> <span id="rate-unit" class="text-slate-500 font-normal">(k / triệu / ngày)</span></label><input id="l-rate" class="input num" inputmode="decimal" value="2"></div>
          <div class="field"><label for="l-days">Số ngày vay <span class="req">*</span></label><input id="l-days" class="input num" inputmode="numeric" value="30"></div>
          <div class="field"><label for="l-period">Kỳ lãi (số ngày mỗi lần đóng) <span class="req">*</span></label><input id="l-period" class="input num" inputmode="numeric" value="10"></div>
        </div>
      </section>

      <section class="card p-5" aria-labelledby="s-other">
        <h2 id="s-other" class="font-semibold">Thông tin khác</h2>
        <div class="mt-4 grid sm:grid-cols-2 gap-4">
          <div class="field"><label for="o-staff">KTV (nhân viên làm hồ sơ)</label><select id="o-staff" class="input"><option>Hùng</option><option>Lan</option><option>Trần Văn A (chủ tiệm)</option></select></div>
          <div class="field sm:col-span-2"><label for="o-note">Ghi chú</label><textarea id="o-note" class="input" rows="3"></textarea></div>
        </div>
      </section>
    </div>

    <!-- Tóm tắt tính lãi -->
    <aside class="card p-5 xl:sticky xl:top-6" aria-labelledby="s-summary">
      <h2 id="s-summary" class="font-semibold">Tóm tắt</h2>
      <dl class="mt-4 flex flex-col gap-3 text-sm">
        <div class="flex justify-between"><dt class="text-slate-500">Tiền giao khách</dt><dd class="num font-semibold" id="o-amount">—</dd></div>
        <div class="flex justify-between"><dt class="text-slate-500">Lãi mỗi kỳ</dt><dd class="num font-semibold" id="o-period">—</dd></div>
        <div class="flex justify-between"><dt class="text-slate-500">Số kỳ</dt><dd class="num" id="o-count">—</dd></div>
        <div class="flex justify-between"><dt class="text-slate-500">Tổng lãi dự kiến</dt><dd class="num font-semibold" id="o-total">—</dd></div>
        <div class="flex justify-between"><dt class="text-slate-500">Ngày đóng lãi đầu tiên</dt><dd class="num" id="o-first">—</dd></div>
        <div class="flex justify-between border-t border-slate-200 pt-3"><dt class="text-slate-500">Lãi suất quy đổi</dt><dd class="num font-semibold" id="o-apr">—</dd></div>
      </dl>
      <p id="o-warn" class="mt-3 text-xs rounded-lg p-3 hidden"></p>
      <p class="mt-3 text-xs text-slate-500">Quỹ két sẽ ghi một khoản chi bằng số tiền vay khi lưu.</p>
      <div class="mt-5 flex flex-col gap-2">
        <button class="btn btn-primary w-full">Lưu hồ sơ</button>
        <a href="cam-do.html" class="btn btn-outline w-full">Huỷ</a>
      </div>
    </aside>
  </form>

</div>
<script src="assets/layout.js"></script>
<script>
  // Tính lãi minh hoạ cho mockup. Logic thật nằm ở module domain, có unit test.
  const $ = id => document.getElementById(id);
  const num = s => Number(String(s).replace(/\./g, '').replace(',', '.')) || 0;
  const UNIT = { kpm: '(k / triệu / ngày)', month: '(% / tháng)', week: '(% / tuần)' };

  function calc() {
    const amount = num($('l-amount').value), rate = num($('l-rate').value);
    const days = num($('l-days').value), period = num($('l-period').value), type = $('l-type').value;
    $('rate-unit').textContent = UNIT[type];
    let perDay, apr;
    if (type === 'kpm') { perDay = amount / 1e6 * rate * 1000; apr = rate * 1000 / 1e6 * 365 * 100; }
    if (type === 'month') { perDay = amount * rate / 100 / 30; apr = rate * 365 / 30; }
    if (type === 'week') { perDay = amount * rate / 100 / 7; apr = rate * 365 / 7; }
    const count = period ? Math.ceil(days / period) : 0;
    $('o-amount').textContent = vnd(amount) + ' đ';
    $('o-period').textContent = vnd(perDay * period) + ' đ';
    $('o-count').textContent = count;
    $('o-total').textContent = vnd(perDay * days) + ' đ';
    const d = new Date($('l-date').value); d.setDate(d.getDate() + period);
    $('o-first').textContent = isNaN(d) ? '—' : d.toLocaleDateString('vi-VN');
    $('o-apr').textContent = apr.toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + '% / năm';

    const w = $('o-warn');
    w.className = 'mt-3 text-xs rounded-lg p-3';
    if (apr >= 100) {
      w.classList.add('bg-red-50', 'text-red-800');
      w.textContent = 'Lãi suất từ 100%/năm trở lên có thể bị truy cứu trách nhiệm hình sự (Điều 201 Bộ luật Hình sự). Kiểm tra lại trước khi lưu.';
    } else if (apr > 20) {
      w.classList.add('bg-amber-50', 'text-amber-800');
      w.textContent = 'Lãi suất vượt 20%/năm (mức trần thoả thuận theo Điều 468 Bộ luật Dân sự 2015, trừ khi luật khác quy định). Cửa hàng tự chịu trách nhiệm tuân thủ.';
    } else w.classList.add('hidden');

    const unsecured = document.querySelector('input[name=kind]:checked').value === 'unsecured';
    $('asset-wrap').classList.toggle('hidden', unsecured);
  }
  document.querySelectorAll('input, select').forEach(el => el.addEventListener('input', calc));
  calc();
</script>
</body>
</html>
